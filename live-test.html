<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ルミス式 通信テスト</title><style>body{font-family:system-ui;background:#fff8f5;color:#241f2c;max-width:720px;margin:auto;padding:16px}.box{background:#fff;border:1px solid #eadfdc;border-radius:14px;padding:14px;margin:10px 0}.ok{color:#08723d;font-weight:800}.ng{color:#b4232f;font-weight:800}.run{font-size:18px;font-weight:900;padding:13px 18px;border:0;border-radius:12px;background:#5d3b76;color:#fff;width:100%}small{color:#746b79}pre{white-space:pre-wrap;word-break:break-word;font-size:11px}</style></head><body><h2>ルミス式・実機通信テスト</h2><p>本番の判定は変更しません。スマホから無料の価格データへ直接つながる経路だけを確認します。</p><button class="run" id="run">テスト開始</button><div id="out"></div><script>
const tests=[
 {name:'Yahoo query1 / RKLB 5分足',url:'https://query1.finance.yahoo.com/v8/finance/chart/RKLB?interval=5m&range=1d',check:j=>j?.chart?.result?.[0]?.timestamp?.length>0},
 {name:'Yahoo query2 / RKLB 5分足',url:'https://query2.finance.yahoo.com/v8/finance/chart/RKLB?interval=5m&range=1d',check:j=>j?.chart?.result?.[0]?.timestamp?.length>0},
 {name:'Yahoo query1 / フジクラ 5分足',url:'https://query1.finance.yahoo.com/v8/finance/chart/5803.T?interval=5m&range=1d',check:j=>j?.chart?.result?.[0]?.timestamp?.length>0},
 {name:'Yahoo query2 / フジクラ 5分足',url:'https://query2.finance.yahoo.com/v8/finance/chart/5803.T?interval=5m&range=1d',check:j=>j?.chart?.result?.[0]?.timestamp?.length>0}
];
async function one(t){const st=performance.now();try{const r=await fetch(t.url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(!t.check(j))throw new Error('価格データなし');return {ok:true,ms:Math.round(performance.now()-st)}}catch(e){return {ok:false,ms:Math.round(performance.now()-st),err:String(e)}}}
document.getElementById('run').onclick=async()=>{const o=document.getElementById('out');o.innerHTML='<div class="box">確認中…</div>';let n=0,html='';for(const t of tests){const r=await one(t);if(r.ok)n++;html+=`<div class="box"><div class="${r.ok?'ok':'ng'}">${r.ok?'成功':'失敗'}：${t.name}</div><small>${r.ms} ms</small>${r.ok?'':`<pre>${r.err}</pre>`}</div>`;o.innerHTML=`<div class="box"><b>${n}/${tests.length} 成功</b></div>`+html;}o.innerHTML=`<div class="box"><b>${n}/${tests.length} 成功</b><br><small>${n? '成功した経路があります。次はその経路だけで20銘柄テストへ進めます。':'4本とも失敗なら、ブラウザ直結方式はここで捨てます。別方式へ進むための確定材料になります。'}</small></div>`+html;};
</script></body></html>
