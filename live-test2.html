<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ルミス式 第2通信テスト</title><style>body{font-family:system-ui;background:#fff8f5;color:#241f2c;max-width:720px;margin:auto;padding:16px}.box{background:#fff;border:1px solid #eadfdc;border-radius:14px;padding:14px;margin:10px 0}.ok{color:#08723d;font-weight:800}.ng{color:#b4232f;font-weight:800}.run{font-size:18px;font-weight:900;padding:13px 18px;border:0;border-radius:12px;background:#5d3b76;color:#fff;width:100%}small{color:#746b79}pre{white-space:pre-wrap;word-break:break-word;font-size:11px}</style></head><body><h2>ルミス式・第2実機通信テスト</h2><p>Yahoo以外の経路がAndroid＋GitHub Pagesから通るかだけ確認します。本体は変更しません。</p><button class="run" id="run">テスト開始</button><div id="out"></div><script>
const tests=[
 {name:'Twelve Data / AAPL 5分足（公式demo）',url:'https://api.twelvedata.com/time_series?symbol=AAPL&interval=5min&outputsize=3&apikey=demo',type:'json',check:j=>Array.isArray(j?.values)&&j.values.length>0},
 {name:'Stooq / AAPL 現在値',url:'https://stooq.com/q/l/?s=aapl.us&f=sd2t2ohlcv&h&e=csv',type:'text',check:s=>/AAPL/i.test(s)&&s.split('\n').length>=2},
 {name:'Stooq / RKLB 現在値',url:'https://stooq.com/q/l/?s=rklb.us&f=sd2t2ohlcv&h&e=csv',type:'text',check:s=>/RKLB/i.test(s)&&s.split('\n').length>=2},
 {name:'Alpha Vantage / IBM 5分足（公式demo）',url:'https://www.alphavantage.co/query?function=TIME_SERIES_INTRADAY&symbol=IBM&interval=5min&apikey=demo',type:'json',check:j=>Object.keys(j||{}).some(k=>k.includes('Time Series'))}
];
async function one(t){const st=performance.now();try{const r=await fetch(t.url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=t.type==='json'?await r.json():await r.text();if(!t.check(d))throw new Error('応答は来たが価格データなし');return {ok:true,ms:Math.round(performance.now()-st)}}catch(e){return {ok:false,ms:Math.round(performance.now()-st),err:String(e)}}}
document.getElementById('run').onclick=async()=>{const o=document.getElementById('out');o.innerHTML='<div class="box">確認中…</div>';let n=0,html='';for(const t of tests){const r=await one(t);if(r.ok)n++;html+=`<div class="box"><div class="${r.ok?'ok':'ng'}">${r.ok?'成功':'失敗'}：${t.name}</div><small>${r.ms} ms</small>${r.ok?'':`<pre>${r.err}</pre>`}</div>`;o.innerHTML=`<div class="box"><b>${n}/${tests.length} 成功</b></div>`+html;}o.innerHTML=`<div class="box"><b>${n}/${tests.length} 成功</b><br><small>結果をそのままスクショしてください。成功経路だけ次段階へ残します。</small></div>`+html;};
</script></body></html>
