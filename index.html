<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4ecff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ルミス式</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#241f2c;background:#fff8f5}
*{box-sizing:border-box}
body{margin:0;padding:8px;max-width:760px;margin:auto}
.hero{background:linear-gradient(135deg,#fff,#f4ecff);border:1px solid #eadff0;border-radius:15px;overflow:hidden;box-shadow:0 5px 18px #77558812}
.logo{display:block;width:100%;height:112px;object-fit:cover;object-position:center 36%}
.sub{color:#716879;font-size:10px;padding:5px 12px 7px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:7px}
.card{background:#fff;border:1px solid #eadfdc;border-radius:12px;padding:8px;min-width:0;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:4px}
.name{font-weight:800;font-size:12px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker{font-size:9px;color:#7a7280;margin-top:2px}
.sig{font-weight:900;font-size:15px;line-height:1.1;text-align:right;flex-shrink:0}
.buy{color:#086b39}.sell{color:#a51d2d}.wait{color:#8a6800}.hold{color:#20539a}
.reason{margin-top:5px;font-size:10px;line-height:1.25;color:#514a57;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:9px;color:#8a818f;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.details{display:none;border-top:1px solid #eee4e2;margin-top:6px;padding-top:6px;font-size:9px;color:#716879;line-height:1.35}
.card.open .details{display:block}
.card.open .reason{-webkit-line-clamp:unset}
.foot{margin:8px 2px 2px;color:#928997;font-size:8px;text-align:center}
.err{grid-column:1/-1;background:#fff1f1;border:1px solid #efcaca;border-radius:12px;padding:10px;font-size:11px}
@media(max-width:350px){body{padding:5px}.grid{gap:4px}.card{padding:6px}.name{font-size:11px}.sig{font-size:13px}}
</style></head><body>
<div class="hero">
  <img class="logo" src="lumis-logo.png" alt="ルミス式 LUMIS INVESTMENT">
  <div id="status" class="sub">デッキを確認しています…</div>
</div>
<div id="grid" class="grid"></div>
<div class="foot">研究用・自動発注なし｜カードをタップで詳細表示</div>
<script>
const cls=s=>s.includes('買')?'buy':s.includes('売')||s.includes('利確')?'sell':(s.includes('持')||s.includes('そのまま'))?'hold':'wait';
const priority=s=>s.includes('買')?0:(s.includes('売')||s.includes('利確'))?1:(s.includes('持')||s.includes('そのまま'))?2:3;
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){
  try{
    const r=await fetch('data/deck.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    document.getElementById('status').textContent=`${d.deck_size}社監視｜更新 ${new Date(d.generated_at).toLocaleString('ja-JP')}`;
    const rows=[...d.results].sort((a,b)=>priority(a.signal)-priority(b.signal));
    document.getElementById('grid').innerHTML=rows.map((x,i)=>`
      <div class="card" data-i="${i}">
        <div class="top">
          <div style="min-width:0"><div class="name">${esc(x.name)}</div><div class="ticker">${esc(x.ticker)}</div></div>
          <div class="sig ${cls(x.signal)}">${esc(x.signal)}</div>
        </div>
        <div class="reason">${esc(x.reason||'')}</div>
        <div class="meta">高値比 ${esc(x.drawdown63_pct??'-')}%｜RSI ${esc(x.rsi14??'-')}</div>
        <div class="details">${esc(x.theme||'')}｜${esc(x.mode||'')}<br>${esc(x.date||'')}　終値 ${esc(x.close??'-')}</div>
      </div>`).join('');
    document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>c.classList.toggle('open')));
  }catch(e){
    document.getElementById('status').textContent='データを読み込めませんでした';
    document.getElementById('grid').innerHTML=`<div class="err">deck.json がまだ公開されていないか、更新中です。</div>`;
  }
}
load();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script></body></html>
