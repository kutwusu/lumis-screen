<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4ecff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ルミセリア Investment Secretary</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#241f2c;background:#fff8f5}
body{margin:0;padding:18px;max-width:760px;margin:auto}
.hero{background:linear-gradient(135deg,#fff,#f4ecff);border:1px solid #eadff0;border-radius:22px;padding:20px;box-shadow:0 8px 30px #77558818}
.hero h1{margin:0 0 6px;font-size:25px}.sub{color:#716879;font-size:13px}
.grid{display:grid;gap:10px;margin-top:16px}.card{background:#fff;border:1px solid #eadfdc;border-radius:18px;padding:15px}
.top{display:flex;justify-content:space-between;gap:8px}.name{font-weight:800}.ticker,.meta{font-size:12px;color:#7a7280}
.sig{font-weight:900;font-size:20px}.buy{color:#086b39}.sell{color:#a51d2d}.wait{color:#8a6800}.hold{color:#20539a}
.reason{margin:7px 0 0;font-size:13px}.foot{margin:18px 0;color:#807786;font-size:11px}
.err{background:#fff1f1;border:1px solid #efcaca;border-radius:14px;padding:12px;margin-top:14px}
</style></head><body>
<div class="hero"><h1>ルミセリア Investment Secretary</h1><div id="status" class="sub">デッキを確認しています…</div></div>
<div id="grid" class="grid"></div>
<div class="foot">研究用。自動発注なし。企業デッキは四半期ごとに見直し、日々の判定は価格ルールで更新。</div>
<script>
const cls=s=>s.includes('買')?'buy':s.includes('売')||s.includes('利確')?'sell':s.includes('持')?'hold':'wait';
const priority=s=>s.includes('買')?0:(s.includes('売')||s.includes('利確'))?1:s.includes('持')?2:3;
async function load(){
  try{
    const r=await fetch('data/deck.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    document.getElementById('status').textContent=`${d.deck_size}社監視｜${d.real_money_status}｜更新 ${new Date(d.generated_at).toLocaleString('ja-JP')}`;
    const rows=[...d.results].sort((a,b)=>priority(a.signal)-priority(b.signal));
    document.getElementById('grid').innerHTML=rows.map(x=>`<div class="card"><div class="top"><div><div class="name">${x.name}</div><div class="ticker">${x.ticker}｜${x.theme||''}｜${x.mode||''}</div></div><div class="sig ${cls(x.signal)}">${x.signal}</div></div><div class="reason">${x.reason||''}</div><div class="meta">${x.date||''} ${x.close??''}｜63日高値比 ${x.drawdown63_pct??'-'}%｜RSI ${x.rsi14??'-'}</div></div>`).join('');
  }catch(e){
    document.getElementById('status').textContent='データを読み込めませんでした';
    document.getElementById('grid').innerHTML=`<div class="err">deck.json がまだ公開されていないか、更新中です。</div>`;
  }
}
load();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script></body></html>
